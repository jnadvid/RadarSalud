[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radarsalud"
version = "0.1.0"
description = "Plataforma local open source de vigilancia epidemiológica con fuentes abiertas reales y modo simulación"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RadarSalud Contributors" }]
keywords = ["epidemiología", "salud pública", "vigilancia", "open data", "españa"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.1",
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "folium>=0.16",
    "jinja2>=3.1",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
scheduler = [
    "apscheduler>=3.10",
]

[project.scripts]
radarsalud = "radarsalud.cli:app"

[tool.setuptools.packages.find]
include = ["radarsalud*"]

[tool.setuptools.package-data]
radarsalud = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
